name = "openspective-worker"
main = "src/index.ts"
compatibility_date = "2024-10-22"
compatibility_flags = ["nodejs_compat"]

# Account ID - set via CLOUDFLARE_ACCOUNT_ID env var or wrangler login
# account_id = "YOUR_ACCOUNT_ID"

[vars]
ENVIRONMENT = "production"
APP_VERSION = "0.1.0"
FRONTEND_URL = "https://openspective.vercel.app"
# Override in .dev.vars for local development

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "openspective-db"
database_id = "YOUR_D1_DATABASE_ID"
migrations_dir = "../../migrations"

# R2 Bucket binding
[[r2_buckets]]
binding = "REPORTS"
bucket_name = "openspective-reports"

# AI binding
[ai]
binding = "AI"

# Worker limits
[limits]
cpu_ms = 50000

[dev]
port = 8787
local_protocol = "http"
